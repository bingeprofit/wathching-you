name: 해외선물 급변동 모니터 (비활성 — 수동 실행 전용)

# ─────────────────────────────────────────────────────────────────────────
# 이 워크플로는 자동으로 돌지 않습니다.
#
# KIS 해외선물 시세는 거래소별로 따로 신청해야 하고, CME 계열은 서브거래소마다
# 월 $228.8 (네 곳이면 월 $915) 입니다. ICE 는 시세료가 0원이지만 그 앞단의
# HTS+MTS 이용 등급 자체가 유료라 결국 무료 경로가 아닙니다. 이 용도에 쓸 만한
# 금액이 아니라서 선물 직접 모니터링은 접고, 원자재·금리·달러는 미국 ETF
# (CPER·CORN·WEAT·SOYB·DBA·IEF·UUP·GLD·SLV·USO·UNG·TLT) 로 우회합니다.
# 그 ETF 들은 미국 워크플로의 관심종목에 이미 들어 있습니다.
#
# 나중에 시세를 신청하시면 아래 주석 처리된 schedule 블록을 되살리세요.
# 그것만으로 예전 일정(한국 낮 60초 / 미국 개장 후 3시간 60초 / 이후 1시간)이
# 그대로 복구됩니다. --market fut 의 시각 인자는 모두 ET 기준입니다.
# ─────────────────────────────────────────────────────────────────────────

on:
  # schedule:
  #   - cron: "0 0 * * 1-5"       # 09:00 KST ~ (한국 오전장)
  #   - cron: "0 3 * * 1-5"       # 12:00 KST ~ (한국 오후장)
  #   - cron: "30 13 * * 1-5"     # EDT 미국 개장
  #   - cron: "30 14 * * 1-5"     # EST 미국 개장
  #   - cron: "0 16-21 * * 1-5"   # 1시간마다 (양쪽 서머타임 구간을 모두 덮는다)
  workflow_dispatch:
    inputs:
      force:
        description: "장 시간을 무시하고 즉시 1회 스캔 (시세 신청 여부 확인용)"
        type: boolean
        default: true      # 수동 전용이므로 기본을 단발 스캔으로 둔다

concurrency:
  # 미국 개장 크론 두 개(13:30 / 14:30 UTC)는 같은 구간이므로 한 그룹으로 묶는다.
  # 크론 문자열로 묶으면 서머타임이 아닌 쪽 잡이 동시에 돌아 알림이 중복된다.
  group: >-
    intraday-fut-${{ (github.event.schedule == '0 0 * * 1-5' && 'kr-am')
    || (github.event.schedule == '0 3 * * 1-5' && 'kr-pm')
    || (github.event.schedule == '0 16-21 * * 1-5' && 'tail')
    || (github.event.schedule && 'us-open') || 'manual' }}
  cancel-in-progress: false

jobs:
  # ── ①② 60초 루프 ──────────────────────────────────────────────────────
  watch:
    if: github.event.schedule != '0 16-21 * * 1-5'
    runs-on: ubuntu-24.04   # ubuntu-latest 는 10/19 부터 Ubuntu 26 — 고정
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 상태 복원
        uses: actions/cache@v4
        with:
          path: state
          key: intraday-fut-${{ github.run_id }}
          restore-keys: intraday-fut-

      # 각 크론이 어디까지 돌지 ET 기준으로 정한다.
      #   00:00 UTC = 20:00/19:00 ET (전일)  → 한국 오전장
      #   03:00 UTC = 23:00/22:00 ET (전일)  → 한국 오후장 (ET 로는 자정을 넘긴다)
      #   13:30/14:30 UTC = 09:30 ET         → 개장 후 3시간(12:25 ET)까지
      # 서머타임에 따라 ET 시각이 1시간 밀리므로 --max-minutes(cap)로 길이를 고정해
      # 두 잡이 겹치지 않게 한다. 겹치면 뒤 잡이 덜 저장된 캐시를 복원해 알림이 중복된다.
      #
      # 주식과 달리 선물은 08:30 ET 에도 장이 열려 있다. 그래서 EST 기간에 13:30 UTC
      # (=08:30 ET) 크론이 '장 시간 아님'으로 걸러지지 않는다. --skip-if-before 09:30
      # 으로 막는다. 주식 워크플로에는 이 가드가 필요 없다(그 시각엔 장이 닫혀 있다).
      - name: 구간 결정
        id: seg
        run: |
          case "${{ github.event.schedule }}" in
            "0 0 * * 1-5")  echo "until=23:00" >> "$GITHUB_OUTPUT"
                            echo "cap=175" >> "$GITHUB_OUTPUT"
                            echo "guard=" >> "$GITHUB_OUTPUT" ;;
            "0 3 * * 1-5")  echo "until=02:35" >> "$GITHUB_OUTPUT"
                            echo "cap=215" >> "$GITHUB_OUTPUT"
                            echo "guard=" >> "$GITHUB_OUTPUT" ;;
            *)              echo "until=12:25" >> "$GITHUB_OUTPUT"
                            echo "cap=175" >> "$GITHUB_OUTPUT"
                            echo "guard=--skip-if-before 09:30 --skip-if-after 10:15" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: 감시 루프
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TELEGRAM_TOKEN:         ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          KIS_APP_KEY:            ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:         ${{ secrets.KIS_APP_SECRET }}
          FUT_ROOTS:              ${{ secrets.FUT_ROOTS }}
          QUIET_LOG:     "1"
          # 무료 ICE 품목은 변동성 폭이 넓다 — 달러인덱스는 일간 0.35%, 커피는 2.5%.
          # 주식의 4% 하한은 물론이고 2% 도 달러인덱스에는 너무 높아 3σ 급변도 걸러진다.
          # 하한을 낮춰 z(3σ) 조건이 실제 판정을 하도록 두는 것이 맞다.
          Z_THRESHOLD:   "3.0"
          MIN_ABS_PCT:   "0.8"
          VOL_RATIO_MIN: "1.8"
          BURST_MIN:     "5"
          BURST_Z:       "4.0"
          BURST_MIN_PCT: "0.4"
          MAX_ALERTS:    "3"
          MAX_PER_HOUR:  "4"
          MAX_PER_DAY:   "10"
          COOLDOWN_MIN:  "180"
          FUT_ROLL_DAYS: "4"
          WORKERS:       "4"
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python monitor.py --market fut --force
          else
            python monitor.py --market fut \
              --loop-until "${{ steps.seg.outputs.until }}" \
              --interval 60 ${{ steps.seg.outputs.guard }} \
              --max-minutes "${{ steps.seg.outputs.cap }}"
          fi

  # ── ③ 12:26~16:00 ET, 1시간마다 단발 ───────────────────────────────────
  tail:
    if: github.event.schedule == '0 16-21 * * 1-5'
    runs-on: ubuntu-24.04   # ubuntu-latest 는 10/19 부터 Ubuntu 26 — 고정
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 상태 복원
        uses: actions/cache@v4
        with:
          path: state
          key: intraday-fut-${{ github.run_id }}
          restore-keys: intraday-fut-

      - name: 단발 스캔
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TELEGRAM_TOKEN:         ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          KIS_APP_KEY:            ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:         ${{ secrets.KIS_APP_SECRET }}
          FUT_ROOTS:              ${{ secrets.FUT_ROOTS }}
          QUIET_LOG:     "1"
          Z_THRESHOLD:   "3.0"
          MIN_ABS_PCT:   "0.8"
          VOL_RATIO_MIN: "1.8"
          # 1시간 간격이면 '최근 5분'을 볼 수 없다. 직전 스캔과의 간격에 맞춘다.
          # 체결 이력은 state/ 에 저장돼 실행 간에 넘어가므로 단발에서도 작동한다.
          BURST_MIN:     "60"
          BURST_Z:       "4.0"
          BURST_MIN_PCT: "0.4"
          MAX_ALERTS:    "3"
          MAX_PER_HOUR:  "4"
          MAX_PER_DAY:   "10"
          COOLDOWN_MIN:  "180"
          FUT_ROLL_DAYS: "4"
          WORKERS:       "4"
        run: python monitor.py --market fut --skip-if-before 12:26
