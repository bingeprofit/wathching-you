name: 한국 장중 급변동 모니터

# 한국 정규장 09:00~15:30 KST = 00:00~06:30 UTC (한국은 서머타임 없음).
#
# cron 최소 간격은 5분이고 그마저 5~15분씩 밀린다. 1분 단위로 보려면 크론을
# 자주 도는 게 아니라 "한 번 깨어나 60초 루프를 도는 장시간 잡" 이어야 한다.
# GitHub Actions 잡 최대 수명이 6시간이라 오전/오후 두 구간으로 나눈다.
#   오전(am) → 12:00 KST 까지 · 오후(pm) → 15:35 KST 까지 (동시호가 포함)
#
# 크론 시각 (2026-10 변경): 예전엔 오전을 UTC 00:00(정각, 하루 중 GitHub 가 가장
# 붐비는 때)에 걸어 10/6 에 24분 늦게 떠 개장 직후를 통째로 놓쳤다. 지금은
#   · 정각을 피해 일찍 깨우고(--wait-open 으로 09:00 까지 기다렸다가 시작),
#   · 구간마다 예비 크론을 하나 더 건다.
# 같은 구간이 두 번 도는 것은 --once-per-day am|pm 이 막는다. 표시는 상태 캐시에
# 남는데 캐시는 잡이 '성공' 해야 저장되므로, 본 잡이 죽었으면 예비 크론이 이어받는다.
# 두 잡이 겹치지 않는 것은 아래 concurrency(같은 그룹 → 앞 잡이 끝날 때까지 대기)가
# 보장한다. 대기열에 하나가 있는데 또 하나가 오면 GitHub 가 앞의 대기를 '취소' 로
# 지우는데(회색), 오전 예비가 오후 잡에 밀려 취소되는 것이라 정상이다.
#
#   cron (UTC)        KST      역할
#   45 23 * * 0-4     08:45    오전 (UTC 로는 전날이라 요일이 일~목)
#   15 0  * * 1-5     09:15    오전 예비
#   40 2  * * 1-5     11:40    오후 (오전 잡이 12:00 에 끝날 때까지 대기열)
#   20 3  * * 1-5     12:20    오후 예비

on:
  schedule:
    - cron: "45 23 * * 0-4"     # 오전
    - cron: "15 0 * * 1-5"      # 오전 예비
    - cron: "40 2 * * 1-5"      # 오후
    - cron: "20 3 * * 1-5"      # 오후 예비
  workflow_dispatch:
    inputs:
      force:
        description: "장 시간을 무시하고 즉시 1회 스캔 (연결 테스트용)"
        type: boolean
        default: false
      loop_until:
        description: "몇 시(KST)까지 돌릴지 (HH:MM)"
        default: "15:35"
      interval:
        description: "스캔 간격(초)"
        default: "60"
      paper_probe:
        description: "모의투자 연결만 확인하고 종료 (주문 없음)"
        type: boolean
        default: false

# 오전·오후 스케줄을 **같은 그룹**에 둔다. 예전엔 크론 문자열로 그룹을 갈라
# 두 잡이 동시에 돌 수 있었다. 오후 잡이 정시(12:00)에 깨면 오전 잡은 아직
# 마지막 회차를 돌거나 캐시를 저장하는 중이고, 오후 잡은 그 **전** 캐시를
# 복원한다 — 오전에 산 종목이 오후 장부에 없는 채로 시작하고, 오후 잡이
# 나중에 저장하므로 그 상태가 다음 날까지 굳는다. 손절이 안 걸린 종목들이
# 그렇게 생겼다. 같은 그룹이면 오후 잡은 오전 잡이 캐시까지 저장하고 끝날
# 때까지 기다렸다가 시작한다 (대기는 1분 안팎, 과금되지 않는다).
# 수동 실행도 루프(force·probe 아님)면 예약과 같은 그룹에 넣는다. 그룹이 다르면
# 수동 루프와 늦게 뜬 예약 루프가 동시에 돌아 알림이 두 번 가고 모의투자 장부가
# 서로 덮어써진다. force·paper_probe 같은 짧은 점검만 따로 돈다.
concurrency:
  group: intraday-kr-${{ (github.event_name == 'schedule' || (!inputs.force && !inputs.paper_probe)) && 'sched' || 'manual' }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04   # ubuntu-latest 는 10/19 부터 Ubuntu 26 — 고정
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # 실행 간 상태(쿨다운·알림 예산·KIS 토큰)를 캐시로 넘긴다.
      # 매 실행 새 키로 저장하고 restore-keys 로 가장 최근 것을 복원한다.
      - name: 상태 복원
        uses: actions/cache@v4
        with:
          path: state
          key: intraday-kr-${{ github.run_id }}
          restore-keys: intraday-kr-

      - name: 구간 결정
        id: seg
        run: |
          S="${{ github.event.schedule }}"
          case "$S" in
            "45 23 * * 0-4"|"15 0 * * 1-5") U="12:00"; K="am" ;;
            "") # 수동 실행: 12:00 이하까지면 오전, 넘으면 오후 구간으로 센다
                U="${{ github.event.inputs.loop_until || '15:35' }}"
                if [[ "$U" < "12:01" ]]; then K="am"; else K="pm"; fi ;;
            *)  U="15:35"; K="pm" ;;
          esac
          echo "until=$U" >> "$GITHUB_OUTPUT"
          echo "key=$K"   >> "$GITHUB_OUTPUT"
          echo "구간 $K → $U 까지"

      - name: 감시 루프
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TELEGRAM_TOKEN:         ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          KIS_APP_KEY:            ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:         ${{ secrets.KIS_APP_SECRET }}
          # 관심종목은 Variables 가 아니라 Secrets 로 둔다. 공개 저장소에서는
          # Variables 가 로그에 평문으로 남고, Secrets 는 *** 로 마스킹된다.
          KR_WATCHLIST:           ${{ secrets.KR_WATCHLIST }}
          # ── 모의투자 반자동 체결 ──────────────────────────────────
          # 조회는 위 실전 키로, 주문만 아래 모의 키로 나간다. 모의 환경은
          # 해외 시세·순위가 제한되고 호출 한도도 낮아 스캔을 옮길 수 없다.
          KIS_PAPER_APP_KEY:      ${{ secrets.KIS_PAPER_APP_KEY }}
          KIS_PAPER_APP_SECRET:   ${{ secrets.KIS_PAPER_APP_SECRET }}
          KIS_PAPER_ACCOUNT:      ${{ secrets.KIS_PAPER_ACCOUNT }}
          PAPER_TRADING:    "1"   # 0 으로 두면 알림·로깅만 하고 버튼은 안 붙는다
          PAPER_ORDER_KRW:  "10000000"   # 건당 주문금액 (고정)
          APPROVE_TTL_MIN:  "15"  # 버튼 유효시간(분). 지나면 만료 안내만 회신
          HOLD_DAYS:        "5"   # 시간청산 — T+5 영업일
          STOP_SD:          "1.5" # 손절 — 진입가 -1.5×일간σ
          TAKE_PROFIT_PCT:  "5.0" # 익절 — 진입가 +5%. 0 이면 끔
          PRICE_LIMIT_PCT:  "29.5"# 상한가·하한가는 승인해도 주문하지 않음
          # 동시 보유 상한. 30 × 1,000만원 = 3억(시드 5억의 60%). 그 위는
          # 매수 직전 주문가능현금 확인이 막는다 (모자라면 가능한 만큼만 산다).
          MAX_POSITIONS:    "30"
          ROUND_TRIP_PCT:   "0.55"
          # 잔고에 있는데 장부에 없는 종목을 장부로 들여 손절·시간청산을 건다.
          ADOPT_ORPHANS:    "1"
          STOP_FALLBACK_PCT: "7.0" # σ 를 못 구했을 때의 손절 %
          # 손으로 들고 있어 자동 청산하면 안 되는 종목코드 (쉼표 구분).
          # 공개 저장소라 Secrets 로 둔다. 비워 두면 전부 관리 대상이다.
          PAPER_IGNORE:     ${{ secrets.PAPER_IGNORE }}
          QUIET_LOG:     "1"      # 로그에 종목명을 남기지 않는다 (공개 저장소)
          Z_THRESHOLD:   "3.0"
          MIN_ABS_PCT:   "4.0"
          VOL_RATIO_MIN: "1.8"
          BURST_MIN:     "5"
          BURST_Z:       "3.5"
          BURST_MIN_PCT: "2.0"
          MAX_ALERTS:    "4"
          MAX_PER_HOUR:  "8"
          MAX_PER_DAY:   "40"
          # ── 체결성 필터 (한국만) ─────────────────────────────
          # 급등률 상위는 가벼운 종목이 지배한다. 호가가 얇으면 +20% 가
          # 몇 억으로 만들어지고, 사러 들어가면 그 폭이 사라진다.
          # 거래대금은 "지금 속도면 종가에 얼마" 로 환산해 비교한다.
          MIN_TURNOVER_KRW: "5e9"    # 일환산 거래대금 50억 미만 제외
          MIN_PRICE_KRW:    "1000"   # 1,000원 미만 제외 (호가단위 노이즈)
          MAX_SD_PCT:       "0"      # 일간 σ 상한(%). 0=끔 (z 가 이미 정규화)
          # 급등 후 가라앉은 종목: 전일종가가 100거래일 최고 종가보다 60% 이상
          # 아래면 제외 (테마 급등→1/N 복귀를 되풀이하는 종목). 0=끔
          DD_MAX_PCT:       "60"
          # ── 같은 날 재알림 ─────────────────────────────────
          # 쿨다운이 지나도, 직전 알림보다 max(5%p, 50%) 이상 더 갔거나
          # 방향이 뒤집혔을 때만 다시 알린다. 종목당 하루 2회까지.
          COOLDOWN_MIN:  "120"
          REALERT_PP:         "5"
          REALERT_REL:        "0.5"
          MAX_PER_TICKER_DAY: "2"
          # ── 관심종목(KR_WATCHLIST) 은 문턱을 낮춰 따로 본다 ─────
          # |등락| 2% 이상 + 2σ 이상, 거래량 조건 없음, 체결성 필터 면제.
          # KODEX 200(069500)을 관심종목에 넣어 두면 시장 대비 초과 2%p 도 요구한다.
          CORE_MIN_ABS_PCT:  "2.0"
          CORE_Z:            "2.0"
          CORE_MIN_REL_PCT:  "2.0"
          CORE_MAX_PER_SCAN: "2"
          RANK_N:        "20"
          TRACK_MAX:     "40"
          WORKERS:       "4"
        run: |
          # 수동 실행 + force 는 루프 대신 단발로 돈다. 장이 닫힌 주말에도
          # 토큰 발급·API 권한·텔레그램 전송을 한 번에 확인하기 위한 것.
          if [ "${{ github.event.inputs.paper_probe }}" = "true" ]; then
            python monitor.py --market kr --paper-probe
          elif [ "${{ github.event.inputs.force }}" = "true" ]; then
            python monitor.py --market kr --force
          else
            python monitor.py --market kr \
              --loop-until "${{ steps.seg.outputs.until }}" \
              --interval "${{ github.event.inputs.interval || '60' }}" \
              --once-per-day "${{ steps.seg.outputs.key }}" --wait-open 20 \
              --max-minutes 240
          fi
