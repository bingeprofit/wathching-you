name: 한국 장중 급변동 모니터

# 한국 정규장 09:00~15:30 KST = 00:00~06:30 UTC (한국은 서머타임 없음).
#
# cron 최소 간격은 5분이고 그마저 5~15분씩 밀린다. 1분 단위로 보려면 크론을
# 자주 도는 게 아니라 "한 번 깨어나 60초 루프를 도는 장시간 잡" 이어야 한다.
# GitHub Actions 잡 최대 수명이 6시간이라 오전/오후 두 잡으로 나눈다.
#   잡A 00:00 UTC (09:00 KST) → 12:00 KST 까지
#   잡B 03:00 UTC (12:00 KST) → 15:35 KST 까지 (동시호가 포함)
# 잡A 를 12:10 까지로 늘려 크론 지연을 덮지 않는 이유: 두 잡이 겹치면 잡B 가
# 잡A 가 아직 저장하지 않은 캐시를 복원해 쿨다운이 풀리고 같은 알림이 두 번 간다.

on:
  schedule:
    - cron: "0 0 * * 1-5"       # 오전장
    - cron: "0 3 * * 1-5"       # 오후장
  workflow_dispatch:
    inputs:
      force:
        description: "장 시간을 무시하고 즉시 1회 스캔 (연결 테스트용)"
        type: boolean
        default: false
      loop_until:
        description: "몇 시(KST)까지 돌릴지 (HH:MM)"
        default: "15:35"
      interval:
        description: "스캔 간격(초)"
        default: "60"

concurrency:
  group: intraday-kr-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # 실행 간 상태(쿨다운·알림 예산·KIS 토큰)를 캐시로 넘긴다.
      # 매 실행 새 키로 저장하고 restore-keys 로 가장 최근 것을 복원한다.
      - name: 상태 복원
        uses: actions/cache@v4
        with:
          path: state
          key: intraday-kr-${{ github.run_id }}
          restore-keys: intraday-kr-

      - name: 구간 결정
        id: seg
        run: |
          if [ "${{ github.event.schedule }}" = "0 0 * * 1-5" ]; then
            echo "until=12:00" >> "$GITHUB_OUTPUT"
          else
            echo "until=${{ github.event.inputs.loop_until || '15:35' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 감시 루프
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TELEGRAM_TOKEN:         ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          KIS_APP_KEY:            ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:         ${{ secrets.KIS_APP_SECRET }}
          # 관심종목은 Variables 가 아니라 Secrets 로 둔다. 공개 저장소에서는
          # Variables 가 로그에 평문으로 남고, Secrets 는 *** 로 마스킹된다.
          KR_WATCHLIST:           ${{ secrets.KR_WATCHLIST }}
          QUIET_LOG:     "1"      # 로그에 종목명을 남기지 않는다 (공개 저장소)
          Z_THRESHOLD:   "3.0"
          MIN_ABS_PCT:   "4.0"
          VOL_RATIO_MIN: "1.8"
          BURST_MIN:     "5"
          BURST_Z:       "3.5"
          BURST_MIN_PCT: "2.0"
          MAX_ALERTS:    "4"
          MAX_PER_HOUR:  "8"
          MAX_PER_DAY:   "30"
          COOLDOWN_MIN:  "120"
          RANK_N:        "20"
          TRACK_MAX:     "40"
          WORKERS:       "4"
        run: |
          # 수동 실행 + force 는 루프 대신 단발로 돈다. 장이 닫힌 주말에도
          # 토큰 발급·API 권한·텔레그램 전송을 한 번에 확인하기 위한 것.
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python monitor.py --market kr --force
          else
            python monitor.py --market kr \
              --loop-until "${{ steps.seg.outputs.until }}" \
              --interval "${{ github.event.inputs.interval || '60' }}" \
              --max-minutes 230
          fi
