name: 미국 장중 급변동 모니터

# 시세는 KIS 해외주식 API. 미국은 KIS 문서 기준 실시간 무료(0분 지연)라
# 1분 단위 감시가 실제로 성립한다 (아시아 시세만 15분 지연).
#
# 미국 정규장 09:30~16:00 ET. cron 은 UTC 고정이라 서머타임을 모른다.
#   EDT(3~11월, UTC-4) = 13:30~20:00 UTC
#   EST(11~3월, UTC-5) = 14:30~21:00 UTC
# 그래서 개장 크론을 13:30 / 14:30 둘 다 걸어두고 실제 판정은 monitor.py 가 ET 로
# 다시 한다. EST 기간에 13:30 UTC 는 08:30 ET 라 '장 시간 아님' 으로 몇 초 만에 끝난다.
#
# 중복·지연 처리 (2026-10 변경): 예전엔 '10:15 ET 이후 시작이면 건너뜀' 으로 막았는데,
# GitHub cron 이 45분 넘게 밀린 날은 그날 1분 감시가 통째로 날아갔다(10/5 엔 11:50 ET 에야 뜬 실행이 그대로 건너뜀).
# 또 EDT 중복 크론(10:30 ET)은 항상 10:15 를 넘으므로 '앞 잡이 죽으면 이어받는다' 는
# 재시도도 사실상 작동하지 않았다. 지금은 두 가드로 나눈다:
#   --once-per-day   : 오늘 루프가 이미 돌았으면 종료. 표시는 상태 파일에 남고, 상태는
#                      앞 잡이 '성공' 으로 끝나야 캐시에 저장되므로 앞 잡이 죽었으면
#                      뒤 크론이 이어받는다 (재시도).
#   --skip-if-after 12:00 : 12:25 까지 25분도 안 남으면 시작하지 않는다.
# concurrency 가 같은 그룹이라 중복 크론은 앞 잡이 끝날 때까지 대기열에서 기다리고
# (대기는 과금 안 됨), 시작하자마자 --once-per-day 로 몇 초 만에 끝난다.
#
# runs-on 은 ubuntu-24.04 로 고정한다. ubuntu-latest 는 2026-10-19 부터 Ubuntu 26 으로
# 넘어가는데, 새 이미지에서 파이썬·캐시 동작이 바뀌어 장중에 깨지는 걸 피하려는 것.
#
# 잠든 시간대이므로 2단계로 나눈다:
#   1단계 개장~12:25 ET : 60초 루프                    ← 순간급변 탐지
#   2단계 12:26~16:00 ET: 1시간마다 단발 + 순위 2배   ← 누적 변동 탐지
# 두 단계가 겹치면 뒤 잡이 앞 잡의 캐시를 덜 저장된 상태로 복원해 쿨다운이 풀린다.
# 알림 상태는 **미국 날짜**로 리셋된다. 2단계는 한국 자정 이후에 돌기 때문에,
# 예전처럼 한국 날짜를 쓰면 오전에 알린 종목을 잊고 같은 종목을 또 보냈다.
# 1단계를 12:25 에 끊고 2단계를 12:26 부터로 막아 간격을 둔다.
#
# 주의: YAML 앵커(&, *)는 GitHub Actions 파서가 지원하지 않아 env 를 그대로 반복한다.

on:
  schedule:
    - cron: "30 13 * * 1-5"       # EDT 개장 (= 09:30 ET)
    - cron: "30 14 * * 1-5"       # EST 개장 (= 09:30 ET)
    - cron: "0 16-21 * * 1-5"     # 2단계 (양쪽 서머타임 구간을 모두 덮는다)
  workflow_dispatch:
    inputs:
      force:
        description: "장 시간을 무시하고 즉시 1회 스캔 (연결 테스트용)"
        type: boolean
        default: false

concurrency:
  group: intraday-us-${{ github.event.schedule == '0 16-21 * * 1-5' && 'tail' || 'open' }}
  cancel-in-progress: false

jobs:
  # ── 1단계: 개장 후 약 3시간, 60초 루프 ─────────────────────────────────
  burst:
    if: github.event.schedule != '0 16-21 * * 1-5'
    runs-on: ubuntu-24.04
    timeout-minutes: 215
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 상태 복원
        uses: actions/cache@v4
        with:
          path: state
          key: intraday-us-${{ github.run_id }}
          restore-keys: intraday-us-

      - name: 감시 루프 (개장~12:25 ET)
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TELEGRAM_TOKEN:         ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          KIS_APP_KEY:            ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:         ${{ secrets.KIS_APP_SECRET }}
          # 관심종목은 Variables 가 아니라 Secrets 로. 공개 저장소에서는 Variables 가
          # 로그에 평문으로 남는다. 비워 두면 monitor.py 의 기본 목록을 쓴다.
          US_WATCHLIST:           ${{ secrets.US_WATCHLIST }}
          QUIET_LOG:     "1"      # 로그에 종목명을 남기지 않는다 (공개 저장소)
          Z_THRESHOLD:   "3.0"
          MIN_ABS_PCT:   "4.0"
          VOL_RATIO_MIN: "1.8"
          BURST_MIN:     "5"
          BURST_Z:       "3.5"
          BURST_MIN_PCT: "2.0"
          MAX_ALERTS:    "4"
          MAX_PER_HOUR:  "8"
          MAX_PER_DAY:   "20"
          # ── 같은 날 재알림 ─────────────────────────────────
          # 쿨다운이 지나도, 직전 알림보다 max(5%p, 50%) 이상 더 갔거나
          # 방향이 뒤집혔을 때만 다시 알린다. 종목당 하루 2회까지.
          COOLDOWN_MIN:  "120"
          REALERT_PP:         "5"
          REALERT_REL:        "0.5"
          MAX_PER_TICKER_DAY: "2"
          # ── 페니·펌프 종목 제외 (관심종목은 면제) ──────────────
          MIN_PRICE_USD:    "5"      # 전일종가 $5 미만 제외 ($1→$6 급등도 걸린다)
          MIN_TURNOVER_USD: "1e7"    # 일환산 거래대금 $10M 미만 제외
          MAX_SD_PCT_US:    "12"     # 최근 20일 일간 σ 12% 초과 제외 (복권형)
          DD_MAX_PCT:       "60"     # 100거래일 최고 종가 대비 -60% 이하 제외
          # ── 관심종목(US_WATCHLIST 또는 기본 목록) 은 문턱을 낮춰 따로 ──
          # |등락| 2%↑ + 2σ↑, 거래량 무관, SPY 대비 초과 2%p↑. 한 번에 2개까지.
          CORE_MIN_ABS_PCT:  "2.0"
          CORE_Z:            "2.0"
          CORE_MIN_REL_PCT:  "2.0"
          CORE_MAX_PER_SCAN: "2"
          RANK_N:        "20"
          SURGE_N:       "10"
          TRACK_MAX:     "40"
          WORKERS:       "4"
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python monitor.py --market us --force
          else
            python monitor.py --market us \
              --loop-until 12:25 --interval 60 \
              --skip-if-after 12:00 --once-per-day --max-minutes 200
          fi

  # ── 2단계: 마감까지 1시간마다 단발, 순위를 2배 깊게 ─────────────────────
  tail:
    if: github.event.schedule == '0 16-21 * * 1-5'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 상태 복원
        uses: actions/cache@v4
        with:
          path: state
          key: intraday-us-${{ github.run_id }}
          restore-keys: intraday-us-

      - name: 단발 스캔
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TELEGRAM_TOKEN:         ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          KIS_APP_KEY:            ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:         ${{ secrets.KIS_APP_SECRET }}
          US_WATCHLIST:           ${{ secrets.US_WATCHLIST }}
          QUIET_LOG:     "1"
          Z_THRESHOLD:   "3.0"
          MIN_ABS_PCT:   "4.0"
          VOL_RATIO_MIN: "1.8"
          # 1시간 간격이면 '최근 5분'을 볼 수 없다. 직전 스캔과의 간격에 맞춘다.
          # 체결 이력은 state/ 에 저장돼 실행 간에 넘어가므로 단발에서도 작동한다.
          BURST_MIN:     "60"
          BURST_Z:       "3.5"
          BURST_MIN_PCT: "3.0"
          MAX_ALERTS:    "6"
          MAX_PER_HOUR:  "8"
          MAX_PER_DAY:   "20"
          # ── 같은 날 재알림 ─────────────────────────────────
          # 쿨다운이 지나도, 직전 알림보다 max(5%p, 50%) 이상 더 갔거나
          # 방향이 뒤집혔을 때만 다시 알린다. 종목당 하루 2회까지.
          COOLDOWN_MIN:  "120"
          REALERT_PP:         "5"
          REALERT_REL:        "0.5"
          MAX_PER_TICKER_DAY: "2"
          # ── 페니·펌프 종목 제외 (관심종목은 면제) ──────────────
          MIN_PRICE_USD:    "5"      # 전일종가 $5 미만 제외 ($1→$6 급등도 걸린다)
          MIN_TURNOVER_USD: "1e7"    # 일환산 거래대금 $10M 미만 제외
          MAX_SD_PCT_US:    "12"     # 최근 20일 일간 σ 12% 초과 제외 (복권형)
          DD_MAX_PCT:       "60"     # 100거래일 최고 종가 대비 -60% 이하 제외
          # ── 관심종목(US_WATCHLIST 또는 기본 목록) 은 문턱을 낮춰 따로 ──
          # |등락| 2%↑ + 2σ↑, 거래량 무관, SPY 대비 초과 2%p↑. 한 번에 2개까지.
          CORE_MIN_ABS_PCT:  "2.0"
          CORE_Z:            "2.0"
          CORE_MIN_REL_PCT:  "2.0"
          CORE_MAX_PER_SCAN: "2"
          RANK_N:        "20"
          SURGE_N:       "10"
          TRACK_MAX:     "40"
          WORKERS:       "4"
        run: |
          python monitor.py --market us --universe full --skip-if-before 12:26
